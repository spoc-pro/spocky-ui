<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Spocky – Assistant support SPOC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      padding: 40px;
    }
    textarea {
      width: 100%;
      height: 120px;
      font-size: 16px;
      padding: 10px;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #response {
      margin-top: 20px;
      background: #fff;
      padding: 15px;
      border-radius: 6px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <h1>Spocky – Assistant support SPOC</h1>
  <p>Pose ta question 👇</p>

  <textarea id="message"></textarea>
  <br />
  <button onclick="sendMessage()">Envoyer</button>

  <div id="response"></div>

  <script>
    const WEBHOOK_URL = "https://spoc-cloud.app.n8n.cloud/webhook/spocky/help";
    const SESSION_KEY = "spocky_session";

    function getSessionId() {
      let id = localStorage.getItem(SESSION_KEY);
      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem(SESSION_KEY, id);
      }
      return id;
    }

    async function sendMessage() {
      const msg = document.getElementById("message").value.trim();
      const responseDiv = document.getElementById("response");

      if (!msg) return;

      responseDiv.textContent = "⏳ Spocky réfléchit...";

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            sessionId: getSessionId(),
            chatInput: msg
          })
        });

        const data = await res.json();
        responseDiv.textContent = data.message || "Réponse vide";
      } catch (e) {
        responseDiv.textContent = "❌ Erreur : " + e.message;
      }
    }
  </script>
</body>
</html>
