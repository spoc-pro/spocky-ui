<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>SPOCKY – Assistant support SPOC</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    textarea {
      width: 100%;
      height: 120px;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
    }
    .error {
      color: red;
      margin-top: 10px;
    }
    .response {
      margin-top: 20px;
      padding: 10px;
      background: #f3f3f3;
    }
  </style>
</head>
<body>

  <h1>SPOCKY – Assistant support SPOC</h1>
  <p>Pose ta question 👇</p>

  <textarea id="question" placeholder="Ex : Bonjour, j’ai un problème Outlook"></textarea>
  <br />
  <button onclick="envoyer()">Envoyer</button>

  <div id="error" class="error"></div>
  <div id="response" class="response"></div>

  <script>
    async function envoyer() {
      const question = document.getElementById("question").value;
      const errorDiv = document.getElementById("error");
      const responseDiv = document.getElementById("response");

      errorDiv.textContent = "";
      responseDiv.textContent = "";

      try {
        const res = await fetch(
          "https://spoc-cloud.app.n8n.cloud/webhook/spocky/help",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: question,
              sessionId: "web-session-1"
            })
          }
        );

        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }

        const data = await res.json();
        responseDiv.textContent = data.message || "Pas de réponse";

      } catch (err) {
        errorDiv.textContent = "❌ Erreur : impossible de contacter SPOCKY";
        console.error(err);
      }
    }
  </script>

</body>
</html>
