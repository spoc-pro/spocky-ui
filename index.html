<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Spocky – Assistant support SPOC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ✅ Cloudflare Turnstile -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #1D1D1B;
  color: white;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ===== AUTH ===== */
#auth-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

#auth-box {
  background: #2a2a28;
  padding: 32px;
  border-radius: 16px;
  width: 360px;
  max-width: 95%;            /* 👈 évite débordement mobile */
  text-align: center;
  animation: fadeInUp 0.6s ease-out;
  box-sizing: border-box;    /* 👈 important */
}

.auth-logo {
  width: 90px;
  margin-bottom: 16px;
}

#auth-box input {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border-radius: 8px;
  border: none;
  font-size: 15px;
  box-sizing: border-box;
}

#auth-box button {
  width: 100%;
  margin-top: 18px;
  padding: 12px;
  background: #23817A;
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

/* ===== RGPD FIX MOBILE ===== */
.rgpd {
  margin-top: 14px;
  text-align: left;
  font-size: 12px;
  color: #ccc;
  line-height: 1.5;
  width: 100%;
}

.rgpd label {
  display: block;            /* 👈 on enlève le flex */
  cursor: pointer;
}

.rgpd input[type="checkbox"] {
  margin-right: 8px;
  vertical-align: top;
}

.rgpd span {
  display: inline;
  white-space: normal;
  word-break: break-word;
}

.rgpd a {
  color: #9fe7e0;
}

/* Petit ajustement mobile */
@media (max-width: 480px) {
  #auth-box {
    width: 94%;
    padding: 24px;
  }

  #auth-box input {
    font-size: 16px; /* évite zoom Safari */
  }
}

/* ===== HEADER ===== */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  border-bottom: 1px solid #333;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-left img {
  width: 42px;
}

.badge-user {
  font-size: 13px;
  color: #ccc;
}

.logout {
  margin-left: 12px;
  cursor: pointer;
  color: #ff6b6b;
  font-size: 13px;
}

/* ===== CHAT ===== */
#chat {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.message {
  max-width: 70%;
  padding: 12px 14px;
  border-radius: 14px;
  margin-bottom: 12px;
  line-height: 1.4;
}

.bot {
  background: white;
  color: black;
}

.user {
  background: #23817A;
  color: white;
  align-self: flex-end;
}

/* ===== BUTTONS ===== */
.choice-btn {
  margin-top: 10px;
  padding: 10px 14px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 14px;
}

.ticket { background: #23817A; color: white; }
.ai { background: #444; color: white; }

/* ===== INPUT ===== */
footer {
  padding: 14px;
  border-top: 1px solid #333;
  display: flex;
  gap: 10px;
}

footer input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
}

footer button {
  padding: 12px 18px;
  background: #23817A;
  border: none;
  border-radius: 10px;
  color: white;
  cursor: pointer;
}

/* ===== ANIM ===== */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== "Spocky réfléchit..." ===== */
.thinking {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-style: italic;
  opacity: 0.9;
}

.dots {
  display: inline-flex;
  gap: 4px;
}

.dots span {
  width: 6px;
  height: 6px;
  background: #111;
  border-radius: 50%;
  display: inline-block;
  animation: bounce 1s infinite ease-in-out;
  opacity: 0.7;
}

.dots span:nth-child(2) { animation-delay: 0.15s; }
.dots span:nth-child(3) { animation-delay: 0.30s; }

@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.6; }
  40% { transform: translateY(-5px); opacity: 1; }
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth-overlay">
  <div id="auth-box">
    <img src="https://spoc.pro/wp-content/uploads/2025/04/Spocky.png" class="auth-logo">
    <h2>Bienvenue 👋</h2>
    <p>Merci de renseigner vos informations pour accéder au support SPOC.</p>

    <input id="firstName" placeholder="Prénom" required>
    <input id="lastName" placeholder="Nom" required>
    <input id="email" type="email" placeholder="Adresse e-mail" required>
    <input id="phone" type="tel" placeholder="Numéro de téléphone" required pattern="[0-9+ ]{8,15}">

    <div class="rgpd">
      <label>
        <input type="checkbox" id="rgpdConsent" required>
        <span>
          J’accepte que SPOC traite mes données personnelles afin de répondre à ma demande de support,
          conformément à la
          <a href="https://spoc.pro/politique-de-confidentialite" target="_blank" rel="noopener">
            politique de confidentialité
          </a>.
        </span>
      </label>
    </div>

    <button onclick="login()">Accéder au chat</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="header-left">
    <img src="https://spoc.pro/wp-content/uploads/2025/04/Spocky.png">
    <div>
      <div><b>Spocky</b></div>
      <div style="font-size:12px;color:#aaa;">Assistant support SPOC</div>
    </div>
  </div>
  <div>
    <span class="badge-user" id="userBadge"></span>
    <span class="logout" onclick="logout()">Déconnexion</span>
  </div>
</header>

<!-- CHAT -->
<div id="chat"></div>

<!-- INPUT -->
<footer>
  <input id="input" placeholder="Écris ton message…">
  <button onclick="send()">Envoyer</button>
</footer>

<!-- ✅ Turnstile container -->
<div id="turnstile-container"></div>

<script>
const WEBHOOK_URL = "https://spoc-cloud.app.n8n.cloud/webhook/spocky/help";
const SESSION_KEY = "spocky_session";
const MODE_KEY = "spocky_mode";

let mode = null;

/* 1 message = 1 Turnstile */
let queuedPayload = null;
let turnstileWidgetId = null;

function initTurnstile() {
  if (turnstileWidgetId) return;

  if (window.turnstile && typeof window.turnstile.render === "function") {
    turnstileWidgetId = window.turnstile.render("#turnstile-container", {
      sitekey: "0x4AAAAAACObC1d7FKkSkeUv",
      size: "invisible",
      callback: onTurnstileSuccess
    });
  } else {
    setTimeout(initTurnstile, 150);
  }
}
window.addEventListener("load", initTurnstile);

async function onTurnstileSuccess(token) {
  if (!queuedPayload) return;

  const { msg, sessionId, mode, thinkingId } = queuedPayload;
  queuedPayload = null;

  try {
    await sendToWebhook(msg, sessionId, mode, token, thinkingId);
  } finally {
    if (window.turnstile && turnstileWidgetId !== null) {
      window.turnstile.reset(turnstileWidgetId);
    }
  }
}

function getSessionId() {
  let id = localStorage.getItem(SESSION_KEY);
  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem(SESSION_KEY, id);
  }
  return id;
}

function addMessage(text, who, id = null) {
  const div = document.createElement("div");
  div.className = "message " + who;
  if (id) div.id = id;
  div.innerHTML = text;
  document.getElementById("chat").appendChild(div);
  div.scrollIntoView({ behavior: "smooth" });
  return div;
}

async function typewriterHTML(el, html, speed = 14) {
  const token = "___BR___";
  const safe = html.replaceAll("<br>", token);

  el.innerHTML = "";
  for (let i = 0; i < safe.length; i++) {
    const ch = safe[i];
    if (safe.slice(i, i + token.length) === token) {
      el.innerHTML += "<br>";
      i += token.length - 1;
    } else {
      el.innerHTML += ch;
    }
    await new Promise(r => setTimeout(r, speed));
  }
}

function showThinkingBubble() {
  const id = "thinking-" + Date.now();
  addMessage(
    `<span class="thinking">Spocky réfléchit
      <span class="dots"><span></span><span></span><span></span></span>
     </span>`,
    "bot",
    id
  );
  return id;
}

function showChoices() {
  addMessage(`
    <b>Que souhaitez-vous faire ?</b><br><br>
    <button class="choice-btn ticket" onclick="selectMode('ticket')">🧾 Créer un ticket</button>
    <button class="choice-btn ai" onclick="selectMode('ai')">🤖 Spocky (IA SPOC), aide-moi</button>
  `, "bot");
}

function selectMode(m) {
  mode = m;
  localStorage.setItem(MODE_KEY, m);

  if (m === "ticket") {
    addMessage("🧾 Création de ticket sélectionnée.", "user");
    addMessage("Merci de décrire votre demande.", "bot");
  } else {
    addMessage("🤖 Mode Spocky activé.", "user");
    addMessage("Je suis à votre écoute 🙂", "bot");
  }
}

/* ===== LOGIN ===== */
function login() {
  const f = firstName.value.trim();
  const l = lastName.value.trim();
  const e = email.value.trim();
  const p = phone.value.trim();
  const consent = document.getElementById("rgpdConsent").checked;

  if (!f || !l || !e || !p) return alert("Tous les champs sont obligatoires.");
  if (!consent) return alert("Veuillez accepter la politique de confidentialité.");

  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(e)) return alert("Adresse e-mail invalide.");

  const phoneRegex = /^[0-9+ ]{8,15}$/;
  if (!phoneRegex.test(p)) return alert("Numéro de téléphone invalide.");

  // Stockage : on garde les anciennes clés + on ajoute phone
  localStorage.setItem("spocky_user", JSON.stringify({ f, l, e, p, consent: true, consentAt: new Date().toISOString() }));

  document.getElementById("auth-overlay").style.display = "none";
  document.getElementById("userBadge").innerText = `Connecté : ${f} ${l} (${p})`;

  addMessage(
    `Bonjour <b>${f}</b> 👋<br>
     Je suis <b>Spocky</b>, assistant support SPOC.<br>
     Comment puis-je vous aider aujourd’hui ?`,
    "bot"
  );

  showChoices();
}

function logout() {
  localStorage.removeItem("spocky_user");
  localStorage.removeItem(SESSION_KEY);
  // On garde le mode en mémoire volontairement. Si tu veux l'effacer : localStorage.removeItem(MODE_KEY);
  location.reload();
}

async function send() {
  const input = document.getElementById("input");
  const msg = input.value.trim();
  if (!msg) return;

  if (!mode) {
    addMessage("Veuillez d’abord choisir une option ci-dessus.", "bot");
    return;
  }

  if (queuedPayload) {
    addMessage("⏳ Un message est déjà en cours d’envoi. Patientez une seconde 🙂", "bot");
    return;
  }

  addMessage(msg, "user");
  input.value = "";

  const thinkingId = showThinkingBubble();

  queuedPayload = {
    msg,
    sessionId: getSessionId(),
    mode,
    thinkingId
  };

  if (!window.turnstile || turnstileWidgetId === null) {
    document.getElementById(thinkingId)?.remove();
    addMessage("❌ Sécurité : Turnstile non prêt. Réessayez dans quelques secondes.", "bot");
    queuedPayload = null;
    return;
  }

  window.turnstile.execute(turnstileWidgetId);
}

async function sendToWebhook(msg, sessionId, mode, token, thinkingId) {
  const user = JSON.parse(localStorage.getItem("spocky_user") || "null");

  const res = await fetch(WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      chatInput: msg,
      sessionId: sessionId,
      mode: mode,
      turnstileToken: token,
      user: user ? {
        firstName: user.f,
        lastName: user.l,
        email: user.e,
        phone: user.p,
        consent: user.consent === true,
        consentAt: user.consentAt || null
      } : null
    })
  });

  const data = await res.json();

  if (thinkingId) document.getElementById(thinkingId)?.remove();

  const botEl = addMessage("", "bot");
  const answer = (data && (data.message || data.output)) ? (data.message || data.output) : "Réponse vide";
  await typewriterHTML(botEl, String(answer).replaceAll("\n", "<br>"), 12);
}

/* Auto-login */
const user = JSON.parse(localStorage.getItem("spocky_user"));
if (user) {
  document.getElementById("auth-overlay").style.display = "none";
  const phoneTxt = user.p ? ` (${user.p})` : "";
  document.getElementById("userBadge").innerText = `Connecté : ${user.f} ${user.l}${phoneTxt}`;

  addMessage(
    `Bonjour <b>${user.f}</b> 👋<br>
     Ravi de vous revoir. Comment puis-je vous aider ?`,
    "bot"
  );

  showChoices();
}

/* Mode par défaut (ticket) */
let savedMode = localStorage.getItem(MODE_KEY);
if (!savedMode) {
  savedMode = "ticket";
  localStorage.setItem(MODE_KEY, savedMode);
}
mode = savedMode;

/* Enter = envoyer */
const inputField = document.getElementById("input");
inputField.addEventListener("keydown", function (event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    send();
  }
});
</script>

</body>
</html>
