<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Spocky – Assistant support SPOC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #1D1D1B;
  color: white;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ================= AUTH ================= */

#auth-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

#auth-box {
  background: #2a2a28;
  padding: 32px;
  border-radius: 16px;
  width: 360px;
  text-align: center;
  animation: fadeInUp 0.6s ease-out;
  box-sizing: border-box;
}

.auth-logo {
  width: 90px;
  margin-bottom: 16px;
}

#auth-box input {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border-radius: 8px;
  border: none;
  font-size: 15px;
  box-sizing: border-box;
}

#auth-box button {
  width: 100%;
  margin-top: 18px;
  padding: 12px;
  background: #23817A;
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

/* ===== RGPD RESPONSIVE SAFE ===== */

#auth-box {
  background: #2a2a28;
  padding: 32px;
  border-radius: 16px;
  width: 360px;
  max-width: 95%;
  text-align: center;
  animation: fadeInUp 0.6s ease-out;
  box-sizing: border-box;
}

.rgpd {
  margin-top: 16px;
  text-align: left;
  font-size: 13px;
  color: #ccc;
  line-height: 1.5;
  width: 100%;
}

.rgpd label {
  display: block;   /* 👈 on supprime le flex */
}

.rgpd input[type="checkbox"] {
  margin-right: 8px;
  transform: scale(1.1);
}

.rgpd span {
  display: inline;
  white-space: normal;
  word-wrap: break-word;
}

.rgpd a {
  color: #9fe7e0;
}

/* ================= HEADER ================= */

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  border-bottom: 1px solid #333;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-left img { width: 42px; }

.badge-user { font-size: 13px; color: #ccc; }

.logout {
  margin-left: 12px;
  cursor: pointer;
  color: #ff6b6b;
  font-size: 13px;
}

/* ================= CHAT ================= */

#chat {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.message {
  max-width: 70%;
  padding: 12px 14px;
  border-radius: 14px;
  margin-bottom: 12px;
  line-height: 1.4;
}

.bot { background: white; color: black; }
.user { background: #23817A; color: white; align-self: flex-end; }

.choice-btn {
  margin-top: 10px;
  padding: 10px 14px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 14px;
}

.ticket { background: #23817A; color: white; }
.ai { background: #444; color: white; }

footer {
  padding: 14px;
  border-top: 1px solid #333;
  display: flex;
  gap: 10px;
}

footer input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
}

footer button {
  padding: 12px 18px;
  background: #23817A;
  border: none;
  border-radius: 10px;
  color: white;
  cursor: pointer;
}

/* ===== MOBILE FIX ===== */

@media (max-width: 480px) {
  #auth-box {
    width: 92%;
    padding: 24px;
  }

  #auth-box input {
    font-size: 16px;
  }
}

/* ===== ANIMATION ===== */

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div id="auth-overlay">
  <div id="auth-box">
    <img src="https://spoc.pro/wp-content/uploads/2025/04/Spocky.png" class="auth-logo">
    <h2>Bienvenue 👋</h2>
    <p>Merci de renseigner vos informations pour accéder au support SPOC.</p>

    <input id="firstName" placeholder="Prénom" required>
    <input id="lastName" placeholder="Nom" required>
    <input id="email" type="email" placeholder="Adresse e-mail" required>
    <input id="phone" type="tel" placeholder="Numéro de téléphone" required>

    <div class="rgpd">
      <label>
        <input type="checkbox" id="rgpdConsent" required>
        <span>
          J’accepte que SPOC traite mes données personnelles afin de répondre à ma demande,
          conformément à la
          <a href="https://spoc.pro/politique-de-confidentialite" target="_blank">
            politique de confidentialité
          </a>.
        </span>
      </label>
    </div>

    <button onclick="login()">Accéder au chat</button>
  </div>
</div>

<header>
  <div class="header-left">
    <img src="https://spoc.pro/wp-content/uploads/2025/04/Spocky.png">
    <div>
      <div><b>Spocky</b></div>
      <div style="font-size:12px;color:#aaa;">Assistant support SPOC</div>
    </div>
  </div>
  <div>
    <span class="badge-user" id="userBadge"></span>
    <span class="logout" onclick="logout()">Déconnexion</span>
  </div>
</header>

<div id="chat"></div>

<footer>
  <input id="input" placeholder="Écris ton message…">
  <button onclick="send()">Envoyer</button>
</footer>

<script>
function login() {
  const f = firstName.value.trim();
  const l = lastName.value.trim();
  const e = email.value.trim();
  const p = phone.value.trim();
  const consent = document.getElementById("rgpdConsent").checked;

  if (!f || !l || !e || !p) return alert("Tous les champs sont obligatoires.");
  if (!consent) return alert("Veuillez accepter la politique de confidentialité.");

  localStorage.setItem("spocky_user", JSON.stringify({ f, l, e, p }));

  document.getElementById("auth-overlay").style.display = "none";
  document.getElementById("userBadge").innerText = `Connecté : ${f} ${l} (${p})`;

  addMessage(`Bonjour <b>${f}</b> 👋<br>Comment puis-je vous aider aujourd’hui ?`, "bot");
  showChoices();
}

function logout() {
  localStorage.removeItem("spocky_user");
  location.reload();
}

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "message " + who;
  div.innerHTML = text;
  document.getElementById("chat").appendChild(div);
  div.scrollIntoView({ behavior: "smooth" });
}

function showChoices() {
  addMessage(`
    <b>Que souhaitez-vous faire ?</b><br><br>
    <button class="choice-btn ticket" onclick="selectMode('ticket')">🧾 Créer un ticket</button>
    <button class="choice-btn ai" onclick="selectMode('ai')">🤖 Spocky (IA SPOC), aide-moi</button>
  `, "bot");
}

function selectMode(m) {
  if (m === "ticket") {
    addMessage("🧾 Création de ticket sélectionnée.", "user");
    addMessage("Merci de décrire votre demande.", "bot");
  } else {
    addMessage("🤖 Mode Spocky activé.", "user");
    addMessage("Je suis à votre écoute 🙂", "bot");
  }
}

const user = JSON.parse(localStorage.getItem("spocky_user"));
if (user) {
  document.getElementById("auth-overlay").style.display = "none";
  document.getElementById("userBadge").innerText = `Connecté : ${user.f} ${user.l} (${user.p})`;
  addMessage(`Bonjour <b>${user.f}</b> 👋<br>Ravi de vous revoir.`, "bot");
  showChoices();
}
</script>

</body>
</html>
