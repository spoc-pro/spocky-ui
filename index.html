<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>SPOCKY – Assistant support SPOC</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f9fb;
      padding: 40px;
    }
    textarea {
      width: 100%;
      height: 120px;
      font-size: 16px;
      padding: 10px;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    .response {
      margin-top: 20px;
      padding: 15px;
      background: #fff;
      border-radius: 5px;
    }
    .error {
      color: red;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<h1>SPOCKY – Assistant support SPOC</h1>
<p>Pose ta question 👇</p>

<textarea id="question" placeholder="Ex : Mon Outlook ne démarre plus"></textarea>
<br>
<button onclick="sendMessage()">Envoyer</button>

<div id="result" class="response"></div>
<div id="error" class="error"></div>

<script>
  const WEBHOOK_URL = "https://spoc-cloud.app.n8n.cloud/webhook/spocky/help";

  // session persistante navigateur
  let sessionId = localStorage.getItem("spockySessionId");
  if (!sessionId) {
    sessionId = crypto.randomUUID();
    localStorage.setItem("spockySessionId", sessionId);
  }

  async function sendMessage() {
    const question = document.getElementById("question").value;
    document.getElementById("error").innerText = "";
    document.getElementById("result").innerText = "⏳ SPOCKY réfléchit...";

    try {
      const response = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: question,
          sessionId: sessionId
        })
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const data = await response.json();
      document.getElementById("result").innerText = data.message;

    } catch (err) {
      document.getElementById("result").innerText = "";
      document.getElementById("error").innerText =
        "❌ Erreur : impossible de contacter SPOCKY";
      console.error(err);
    }
  }
</script>

</body>
</html>
