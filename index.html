<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>SPOCKY – Assistant support SPOC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      padding: 40px;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      font-size: 16px;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #response {
      margin-top: 20px;
      padding: 15px;
      background: #fff;
      border-radius: 6px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<h1>SPOCKY – Assistant support SPOC</h1>
<p>Pose ta question 👇</p>

<textarea id="message"></textarea>
<br />
<button onclick="sendMessage()">Envoyer</button>

<div id="response"></div>

<script>
const WEBHOOK_URL = "https://spoc-cloud.app.n8n.cloud/webhook-test/spocky/help";
const SESSION_KEY = "spocky_session_id";

function getSessionId() {
  let id = localStorage.getItem(SESSION_KEY);
  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem(SESSION_KEY, id);
  }
  return id;
}

async function sendMessage() {
  const message = document.getElementById("message").value.trim();
  const responseDiv = document.getElementById("response");

  if (!message) return;

  responseDiv.textContent = "⏳ SPOCKY réfléchit...";

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chatInput: message,
        sessionId: getSessionId()
      })
    });

    const data = await res.json();

    responseDiv.textContent = data.output || "Réponse vide";
  } catch (err) {
    responseDiv.textContent = "❌ Erreur : " + err.message;
  }
}
</script>

</body>
</html>
