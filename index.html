<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Spocky – Assistant support SPOC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root {
  --bg: #0f172a;
  --panel: #020617;
  --user: #2563eb;
  --bot: #1e293b;
  --text: #e5e7eb;
  --muted: #94a3b8;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Inter, system-ui, sans-serif;
  background: linear-gradient(180deg, #020617, #020617);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 16px 24px;
  border-bottom: 1px solid #1e293b;
  background: #020617;
}

header h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
}

header span {
  color: var(--muted);
  font-size: 13px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.message {
  max-width: 75%;
  padding: 12px 16px;
  border-radius: 14px;
  line-height: 1.4;
  white-space: pre-wrap;
  animation: fadeIn 0.2s ease;
}

.user {
  align-self: flex-end;
  background: var(--user);
  color: white;
  border-bottom-right-radius: 4px;
}

.bot {
  align-self: flex-start;
  background: var(--bot);
  border-bottom-left-radius: 4px;
}

.typing {
  font-size: 13px;
  color: var(--muted);
  padding-left: 4px;
}

footer {
  padding: 16px;
  border-top: 1px solid #1e293b;
  background: #020617;
}

#input-box {
  display: flex;
  gap: 12px;
}

textarea {
  flex: 1;
  resize: none;
  height: 48px;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid #1e293b;
  background: #020617;
  color: var(--text);
  font-size: 14px;
}

textarea:focus {
  outline: none;
  border-color: #2563eb;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  padding: 0 18px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 500;
}

button:hover {
  opacity: 0.9;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<header>
  <h1>Spocky</h1>
  <span>Assistant support SPOC</span>
</header>

<div id="chat"></div>

<footer>
  <div id="input-box">
    <textarea id="message" placeholder="Écris ton message…"></textarea>
    <button onclick="sendMessage()">Envoyer</button>
  </div>
</footer>

<script>
const WEBHOOK_URL = "https://spoc-cloud.app.n8n.cloud/webhook/spocky/help";
const SESSION_KEY = "spocky_session_id";

function getSessionId() {
  let id = localStorage.getItem(SESSION_KEY);
  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem(SESSION_KEY, id);
  }
  return id;
}

const chat = document.getElementById("chat");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "typing";
  div.id = "typing";
  div.textContent = "Spocky réfléchit…";
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById("typing");
  if (t) t.remove();
}

async function sendMessage() {
  const textarea = document.getElementById("message");
  const text = textarea.value.trim();
  if (!text) return;

  addMessage(text, "user");
  textarea.value = "";

  showTyping();

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chatInput: text,          // 🔒 OBLIGATOIRE
        sessionId: getSessionId() // 🔒 OBLIGATOIRE
      })
    });

    const data = await res.json(); // 🔒 attendu { message: "..." }

    hideTyping();
    addMessage(data.message || "Réponse vide", "bot");

  } catch (e) {
    hideTyping();
    addMessage("❌ Impossible de contacter Spocky", "bot");
  }
}

document.getElementById("message").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
