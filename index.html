<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>SPOCKY – Assistant support SPOC</title>
</head>
<body>

<h1>SPOCKY – Assistant support SPOC</h1>

<textarea id="question" rows="6" cols="80" placeholder="Pose ta question…"></textarea><br><br>
<button onclick="envoyer()">Envoyer</button>

<p id="reponse"></p>

<script>
async function envoyer() {
  const question = document.getElementById("question").value;
  const reponse = document.getElementById("reponse");

  reponse.innerText = "⏳ SPOCKY réfléchit…";

  try {
    const res = await fetch("https://spoc-cloud.app.n8n.cloud/webhook/spocky/help", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: question,
        sessionId: "web-session"
      })
    });

    const data = await res.json();
    reponse.innerText = data.message;

  } catch (e) {
    reponse.innerText = "❌ Impossible de contacter SPOCKY";
    console.error(e);
  }
}
</script>

</body>
</html>
