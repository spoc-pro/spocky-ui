<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Spocky – Assistant support SPOC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Cloudflare Turnstile -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #1D1D1B;
  color: white;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* AUTH */
#auth-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}
#auth-box {
  background: #2a2a28;
  padding: 32px;
  border-radius: 16px;
  width: 360px;
  text-align: center;
}
.auth-logo {
  width: 90px;
  margin-bottom: 16px;
}
#auth-box input {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border-radius: 8px;
  border: none;
}
#auth-box button {
  width: 100%;
  margin-top: 20px;
  padding: 12px;
  background: #23817A;
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  border-bottom: 1px solid #333;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.header-left img {
  width: 42px;
}
.badge-user {
  font-size: 13px;
  color: #ccc;
}
.logout {
  margin-left: 12px;
  cursor: pointer;
  color: #ff6b6b;
}

/* CHAT */
#chat {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.message {
  max-width: 70%;
  padding: 12px 14px;
  border-radius: 14px;
  margin-bottom: 12px;
}
.bot {
  background: white;
  color: black;
}
.user {
  background: #23817A;
  color: white;
  align-self: flex-end;
}

/* BUTTONS */
.choice-btn {
  margin-top: 10px;
  padding: 10px 14px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}
.ticket { background: #23817A; color: white; }
.ai { background: #444; color: white; }

/* INPUT */
footer {
  padding: 14px;
  border-top: 1px solid #333;
  display: flex;
  gap: 10px;
}
footer input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
}
footer button {
  padding: 12px 18px;
  background: #23817A;
  border: none;
  border-radius: 10px;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth-overlay">
  <div id="auth-box">
    <img src="https://spoc.pro/wp-content/uploads/2025/04/Spocky.png" class="auth-logo">
    <h2>Bienvenue 👋</h2>
    <p>Merci de renseigner vos informations pour accéder au support SPOC.</p>
    <input id="firstName" placeholder="Prénom">
    <input id="lastName" placeholder="Nom">
    <input id="email" placeholder="Adresse e-mail">
    <button onclick="login()">Accéder au chat</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="header-left">
    <img src="https://spoc.pro/wp-content/uploads/2025/04/Spocky.png">
    <div>
      <b>Spocky</b>
      <div style="font-size:12px;color:#aaa;">Assistant support SPOC</div>
    </div>
  </div>
  <div>
    <span class="badge-user" id="userBadge"></span>
    <span class="logout" onclick="logout()">Déconnexion</span>
  </div>
</header>

<!-- CHAT -->
<div id="chat"></div>

<!-- INPUT -->
<footer>
  <input id="input" placeholder="Écris ton message…">
  <button onclick="send()">Envoyer</button>
</footer>

<!-- TURNSTILE (Invisible) -->
<div class="cf-turnstile"
     data-sitekey="0x4AAAAAACObC1d7FKkSkeUv"
     data-size="invisible"
     data-callback="onTurnstileSuccess">
</div>

<script>
const WEBHOOK_URL = "https://spoc-cloud.app.n8n.cloud/webhook/spocky/help";
const SESSION_KEY = "spocky_session";

let mode = null;
let turnstileToken = null;

/* Turnstile callback */
function onTurnstileSuccess(token) {
  turnstileToken = token;
}

/* Session */
function getSessionId() {
  let id = localStorage.getItem(SESSION_KEY);
  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem(SESSION_KEY, id);
  }
  return id;
}

/* UI */
function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "message " + who;
  div.innerHTML = text;
  chat.appendChild(div);
  div.scrollIntoView();
}

/* Choices */
function showChoices() {
  addMessage(`
    <b>Que souhaitez-vous faire ?</b><br><br>
    <button class="choice-btn ticket" onclick="selectMode('ticket')">🧾 Créer un ticket</button>
    <button class="choice-btn ai" onclick="selectMode('ai')">🤖 Spocky (IA SPOC), aide-moi</button>
  `, "bot");
}

function selectMode(m) {
  mode = m;
  addMessage(m === "ticket"
    ? "🧾 Création de ticket sélectionnée."
    : "🤖 Mode Spocky activé.",
    "user");
  addMessage("Je suis à votre écoute 🙂", "bot");
}

/* Auth */
function login() {
  const f = firstName.value.trim();
  const l = lastName.value.trim();
  const e = email.value.trim();
  if (!f || !l || !e) return alert("Champs manquants");

  localStorage.setItem("spocky_user", JSON.stringify({ f, l, e }));
  auth-overlay.style.display = "none";
  userBadge.innerText = `Connecté : ${f} ${l}`;

  addMessage(`Bonjour <b>${f}</b> 👋<br>Je suis <b>Spocky</b>.`, "bot");
  showChoices();
}

function logout() {
  localStorage.clear();
  location.reload();
}

/* Send */
async function send() {
  const msg = input.value.trim();
  if (!msg || !mode || !turnstileToken) return;

  addMessage(msg, "user");
  input.value = "";

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chatInput: msg,
        sessionId: getSessionId(),
        mode: mode,
        turnstileToken: turnstileToken
      })
    });

    const data = await res.json();
    addMessage(data.message || "Réponse vide", "bot");
  } catch {
    addMessage("❌ Erreur : impossible de contacter Spocky.", "bot");
  }
}

/* Enter key */
input.addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});

/* Auto-login */
const user = JSON.parse(localStorage.getItem("spocky_user"));
if (user) {
  auth-overlay.style.display = "none";
  userBadge.innerText = `Connecté : ${user.f} ${user.l}`;
  addMessage(`Bonjour <b>${user.f}</b> 👋`, "bot");
  showChoices();
}
</script>

</body>
</html>
