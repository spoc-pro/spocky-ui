<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Spocky – Assistant support SPOC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    font-family: Inter, Arial, sans-serif;
    background: #1D1D1B;
    color: #ffffff;
    display: flex;
    flex-direction: column;
  }

  /* ===== HEADER ===== */
  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    background: #fff;
  }

  .header-text h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
  }

  .header-text span {
    font-size: 13px;
    color: #b0b0b0;
  }

  /* ===== CHAT ===== */
  .chat {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .bubble {
    max-width: 70%;
    padding: 14px 16px;
    border-radius: 18px;
    line-height: 1.4;
    font-size: 15px;
    white-space: pre-wrap;
  }

  .bot {
    background: #ffffff;
    color: #000000;
    align-self: flex-start;
    border-top-left-radius: 6px;
  }

  .user {
    background: #23817A;
    color: #ffffff;
    align-self: flex-end;
    border-top-right-radius: 6px;
  }

  /* ===== INPUT ===== */
  .input-zone {
    display: flex;
    gap: 12px;
    padding: 16px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }

  textarea {
    flex: 1;
    resize: none;
    height: 48px;
    border-radius: 12px;
    border: none;
    padding: 12px 14px;
    font-size: 15px;
    outline: none;
  }

  button {
    background: #23817A;
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 15px;
    padding: 0 20px;
    cursor: pointer;
  }

  button:hover {
    opacity: 0.9;
  }
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
  <img
    src="https://spoc.pro/wp-content/uploads/2025/04/Spocky.png"
    alt="Spocky"
    class="avatar"
  />
  <div class="header-text">
    <h1>Spocky</h1>
    <span>Assistant support SPOC</span>
  </div>
</header>

<!-- CHAT -->
<div class="chat" id="chat">
  <div class="bubble bot">
    Bonjour ! 👋  
    Comment puis-je vous aider aujourd’hui ?  
    N’hésitez pas à me décrire votre demande ou le problème rencontré.
  </div>
</div>

<!-- INPUT -->
<div class="input-zone">
  <textarea id="message" placeholder="Écris ton message..."></textarea>
  <button onclick="sendMessage()">Envoyer</button>
</div>

<script>
  const WEBHOOK_URL = "https://spoc-cloud.app.n8n.cloud/webhook-test/spocky/help";
  const SESSION_KEY = "spocky_session_id";

  function getSessionId() {
    let id = localStorage.getItem(SESSION_KEY);
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem(SESSION_KEY, id);
    }
    return id;
  }

  function addBubble(text, type) {
    const chat = document.getElementById("chat");
    const bubble = document.createElement("div");
    bubble.className = "bubble " + type;
    bubble.textContent = text;
    chat.appendChild(bubble);
    chat.scrollTop = chat.scrollHeight;
  }

  async function sendMessage() {
    const textarea = document.getElementById("message");
    const message = textarea.value.trim();
    if (!message) return;

    addBubble(message, "user");
    textarea.value = "";

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chatInput: message,
          sessionId: getSessionId()
        })
      });

      const data = await res.json();
      addBubble(data.message || "Réponse vide", "bot");

    } catch (err) {
      addBubble("❌ Erreur de connexion avec Spocky", "bot");
    }
  }

  document.getElementById("message").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>

</body>
</html>
