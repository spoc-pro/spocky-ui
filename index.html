<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>SPOCKY – Assistant support SPOC</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #ffffff;
    }

    h1 {
      font-size: 28px;
    }

    textarea {
      width: 100%;
      height: 120px;
      font-size: 16px;
      padding: 10px;
      margin-top: 10px;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #reponse {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 5px;
      min-height: 40px;
      white-space: pre-wrap;
    }

    .error {
      color: red;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h1>SPOCKY – Assistant support SPOC</h1>

  <p>Pose ta question 👇</p>

  <textarea id="question" placeholder="Ex : Bonjour, j’ai un problème Outlook..."></textarea>
  <br />
  <button onclick="envoyer()">Envoyer</button>

  <div id="reponse"></div>
  <div id="error" class="error"></div>

  <script>
    async function envoyer() {
      const question = document.getElementById("question").value;
      const reponseDiv = document.getElementById("reponse");
      const errorDiv = document.getElementById("error");

      reponseDiv.innerText = "";
      errorDiv.innerText = "";

      if (!question.trim()) {
        errorDiv.innerText = "Merci de saisir une question.";
        return;
      }

      try {
        const response = await fetch(
          "https://spoc-cloud.app.n8n.cloud/webhook/spocky/help",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: question,
              sessionId: "web-session-1"
            })
          }
        );

        if (!response.ok) {
          throw new Error("Erreur HTTP " + response.status);
        }

        const data = await response.json();

        reponseDiv.innerText = data.message || "Aucune réponse de SPOCKY.";
      } catch (err) {
        errorDiv.innerText = "❌ Erreur : impossible de contacter SPOCKY";
        console.error(err);
      }
    }
  </script>

</body>
</html>
