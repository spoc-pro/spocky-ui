<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>SPOCKY – Assistant support SPOC</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    textarea { width: 100%; height: 120px; }
    button { margin-top: 10px; padding: 8px 16px; }
    .error { color: red; margin-top: 10px; }
    .response { margin-top: 20px; white-space: pre-wrap; }
  </style>
</head>
<body>

<h1>SPOCKY – Assistant support SPOC</h1>
<p>Pose ta question 👇</p>

<textarea id="message" placeholder="Bonjour..."></textarea><br />
<button onclick="send()">Envoyer</button>

<div class="response" id="response"></div>
<div class="error" id="error"></div>

<script>
async function send() {
  const message = document.getElementById("message").value;
  document.getElementById("response").textContent = "";
  document.getElementById("error").textContent = "";

  try {
    const res = await fetch(
      "https://spoc-cloud.app.n8n.cloud/webhook-test/spocky/help",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: message,
          sessionId: "test-session-1"
        })
      }
    );

    const data = await res.json();
    document.getElementById("response").textContent =
      "SPOCKY : " + (data.message || JSON.stringify(data));
  } catch (e) {
    document.getElementById("error").textContent =
      "❌ Erreur : impossible de contacter SPOCKY";
  }
}
</script>

</body>
</html>
