<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Spocky – Assistant support SPOC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Cloudflare Turnstile -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #1D1D1B;
  color: white;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ===== AUTH ===== */
#auth-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

#auth-box {
  background: #2a2a28;
  padding: 32px;
  border-radius: 16px;
  width: 360px;
  text-align: center;
  animation: fadeInUp 0.6s ease-out;
}

.auth-logo {
  width: 90px;
  margin-bottom: 16px;
}

#auth-box input {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border-radius: 8px;
  border: none;
  font-size: 15px;
  box-sizing: border-box;
}

#auth-box button {
  width: 100%;
  margin-top: 18px;
  padding: 12px;
  background: #23817A;
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

/* RGPD */
.rgpd {
  margin-top: 14px;
  text-align: left;
  font-size: 12px;
  color: #ccc;
  line-height: 1.4;
}

.rgpd label {
  display: flex;
  gap: 8px;
  cursor: pointer;
}

.rgpd input {
  margin-top: 3px;
}

.rgpd a {
  color: #9fe7e0;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  border-bottom: 1px solid #333;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-left img {
  width: 42px;
}

.badge-user {
  font-size: 13px;
  color: #ccc;
}

.logout {
  margin-left: 12px;
  cursor: pointer;
  color: #ff6b6b;
  font-size: 13px;
}

/* CHAT */
#chat {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.message {
  max-width: 70%;
  padding: 12px 14px;
  border-radius: 14px;
  margin-bottom: 12px;
  line-height: 1.4;
}

.bot { background: white; color: black; }
.user { background: #23817A; color: white; align-self: flex-end; }

/* INPUT */
footer {
  padding: 14px;
  border-top: 1px solid #333;
  display: flex;
  gap: 10px;
}

footer input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
}

footer button {
  padding: 12px 18px;
  background: #23817A;
  border: none;
  border-radius: 10px;
  color: white;
  cursor: pointer;
}

/* Animations */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.thinking {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-style: italic;
  opacity: 0.9;
}
.dots span {
  width: 6px;
  height: 6px;
  background: #111;
  border-radius: 50%;
  display: inline-block;
  animation: bounce 1s infinite ease-in-out;
}
@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); }
  40% { transform: translateY(-5px); }
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth-overlay">
  <div id="auth-box">
    <img src="https://spoc.pro/wp-content/uploads/2025/04/Spocky.png" class="auth-logo">
    <h2>Bienvenue 👋</h2>
    <p>Merci de renseigner vos informations pour accéder au support SPOC.</p>

    <input id="firstName" placeholder="Prénom" required>
    <input id="lastName" placeholder="Nom" required>
    <input id="email" type="email" placeholder="Adresse e-mail" required>
    <input id="phone" type="tel" placeholder="Numéro de téléphone" required pattern="[0-9+ ]{8,15}">

    <div class="rgpd">
      <label>
        <input type="checkbox" id="rgpdConsent" required>
        <span>
          J’accepte que SPOC traite mes données personnelles afin de répondre à ma demande,
          conformément à la <a href="https://spoc.pro/politique-de-confidentialite" target="_blank">politique de confidentialité</a>.
        </span>
      </label>
    </div>

    <button onclick="login()">Accéder au chat</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="header-left">
    <img src="https://spoc.pro/wp-content/uploads/2025/04/Spocky.png">
    <div>
      <div><b>Spocky</b></div>
      <div style="font-size:12px;color:#aaa;">Assistant support SPOC</div>
    </div>
  </div>
  <div>
    <span class="badge-user" id="userBadge"></span>
    <span class="logout" onclick="logout()">Déconnexion</span>
  </div>
</header>

<div id="chat"></div>

<footer>
  <input id="input" placeholder="Écris ton message…">
  <button onclick="send()">Envoyer</button>
</footer>

<div id="turnstile-container"></div>

<script>
const WEBHOOK_URL = "https://spoc-cloud.app.n8n.cloud/webhook/spocky/help";
const SESSION_KEY = "spocky_session";
let mode = null;
let queuedPayload = null;
let turnstileWidgetId = null;

/* ================= LOGIN ================= */

function login() {
  const f = firstName.value.trim();
  const l = lastName.value.trim();
  const e = email.value.trim();
  const p = phone.value.trim();
  const consent = document.getElementById("rgpdConsent").checked;

  if (!f || !l || !e || !p) return alert("Tous les champs sont obligatoires.");
  if (!consent) return alert("Vous devez accepter la politique de confidentialité.");

  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(e)) return alert("Adresse e-mail invalide.");

  const phoneRegex = /^[0-9+ ]{8,15}$/;
  if (!phoneRegex.test(p)) return alert("Numéro de téléphone invalide.");

  localStorage.setItem("spocky_user", JSON.stringify({
    f, l, e, p,
    consent: true,
    consentAt: new Date().toISOString()
  }));

  document.getElementById("auth-overlay").style.display = "none";
  document.getElementById("userBadge").innerText = `Connecté : ${f} ${l}`;

  addMessage(
    `Bonjour <b>${f}</b> 👋<br>
     Je suis <b>Spocky</b>, assistant support SPOC.<br>
     Comment puis-je vous aider aujourd’hui ?`,
    "bot"
  );

  showChoices();
}

/* ================= AUTO LOGIN ================= */

const user = JSON.parse(localStorage.getItem("spocky_user"));
if (user) {
  document.getElementById("auth-overlay").style.display = "none";
  document.getElementById("userBadge").innerText = `Connecté : ${user.f} ${user.l}`;
  addMessage(`Bonjour <b>${user.f}</b> 👋<br>Ravi de vous revoir.`, "bot");
  showChoices();
}
</script>

</body>
</html>
