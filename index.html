<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Spocky – Assistant support SPOC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #1D1D1B;
  color: #fff;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ---------- FORM ---------- */
#user-form {
  background: #2a2a28;
  padding: 30px;
  border-radius: 12px;
  width: 100%;
  max-width: 380px;
}

#user-form h2 {
  margin-top: 0;
}

#user-form input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
  border: none;
}

#user-form button {
  margin-top: 20px;
  width: 100%;
  padding: 12px;
  background: #23817A;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

/* ---------- CHAT ---------- */
#chat {
  display: none;
  width: 100%;
  height: 100vh;
  flex-direction: column;
}

header {
  display: flex;
  align-items: center;
  padding: 14px;
  background: #151514;
  gap: 10px;
}

header img {
  width: 42px;
  height: 42px;
  object-fit: contain;
}

.messages {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.bubble {
  max-width: 70%;
  padding: 12px 16px;
  border-radius: 14px;
  margin-bottom: 10px;
  white-space: pre-wrap;
}

.user {
  background: #23817A;
  margin-left: auto;
}

.bot {
  background: #ffffff;
  color: #000;
}

footer {
  display: flex;
  padding: 10px;
  background: #151514;
}

footer input {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: none;
}

footer button {
  margin-left: 10px;
  padding: 10px 16px;
  border-radius: 8px;
  border: none;
  background: #23817A;
  color: white;
}
</style>
</head>

<body>

<!-- ÉCRAN FORMULAIRE -->
<div id="user-form">
  <h2>Bienvenue 👋</h2>
  <p>Avant de commencer, merci de renseigner vos informations.</p>

  <input id="prenom" placeholder="Prénom" />
  <input id="nom" placeholder="Nom" />
  <input id="email" placeholder="Adresse e-mail" type="email" />

  <button onclick="startChat()">Accéder au chat</button>
</div>

<!-- ÉCRAN CHAT -->
<div id="chat">
  <header>
    <img src="https://spoc.pro/wp-content/uploads/2025/04/Spocky.png">
    <div>
      <strong>Spocky</strong><br>
      <small>Assistant support SPOC</small>
    </div>
  </header>

  <div class="messages" id="messages"></div>

  <footer>
    <input id="messageInput" placeholder="Écris ton message..." />
    <button onclick="sendMessage()">Envoyer</button>
  </footer>
</div>

<script>
const WEBHOOK_URL = "https://spoc-cloud.app.n8n.cloud/webhook-test/spocky/help";
const SESSION_KEY = "spocky_session";

function getSessionId() {
  let id = localStorage.getItem(SESSION_KEY);
  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem(SESSION_KEY, id);
  }
  return id;
}

function startChat() {
  const prenom = document.getElementById("prenom").value.trim();
  const nom = document.getElementById("nom").value.trim();
  const email = document.getElementById("email").value.trim();

  if (!prenom || !nom || !email) {
    alert("Merci de remplir tous les champs");
    return;
  }

  localStorage.setItem("spocky_user", JSON.stringify({ prenom, nom, email }));

  document.getElementById("user-form").style.display = "none";
  document.getElementById("chat").style.display = "flex";
}

async function sendMessage() {
  const input = document.getElementById("messageInput");
  const text = input.value.trim();
  if (!text) return;

  const messages = document.getElementById("messages");
  const user = JSON.parse(localStorage.getItem("spocky_user"));

  messages.innerHTML += `<div class="bubble user">${text}</div>`;
  input.value = "";

  const res = await fetch(WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      chatInput: text,
      sessionId: getSessionId(),
      user
    })
  });

  const data = await res.json();
  messages.innerHTML += `<div class="bubble bot">${data.message}</div>`;
  messages.scrollTop = messages.scrollHeight;
}

// Auto affichage si déjà rempli
if (localStorage.getItem("spocky_user")) {
  document.getElementById("user-form").style.display = "none";
  document.getElementById("chat").style.display = "flex";
}
</script>

</body>
</html>
