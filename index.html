<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Spocky – Assistant support SPOC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #1D1D1B;
  color: white;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ===== AUTH ===== */
#auth-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

#auth-box {
  background: #2a2a28;
  padding: 32px;
  border-radius: 16px;
  width: 360px;
  text-align: center;
  animation: fadeInUp 0.6s ease-out;
}

.auth-logo {
  width: 80px;
  height: auto;
  margin-bottom: 16px;
}

#auth-box input {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border-radius: 8px;
  border: none;
  font-size: 15px;
}

#auth-box button {
  width: 100%;
  margin-top: 20px;
  padding: 12px;
  background: #23817A;
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

/* ===== HEADER ===== */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid #333;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-left img {
  width: 42px;
}

.header-title {
  font-weight: bold;
}

.badge-user {
  font-size: 13px;
  color: #ccc;
}

/* ===== CHAT ===== */
#chat {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.message {
  max-width: 70%;
  padding: 12px 14px;
  border-radius: 14px;
  margin-bottom: 12px;
  line-height: 1.4;
}

.bot {
  background: white;
  color: black;
  align-self: flex-start;
}

.user {
  background: #23817A;
  color: white;
  align-self: flex-end;
  margin-left: auto;
}

/* ===== INPUT ===== */
footer {
  padding: 14px;
  border-top: 1px solid #333;
  display: flex;
  gap: 10px;
}

footer input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
}

footer button {
  padding: 12px 18px;
  background: #23817A;
  border: none;
  border-radius: 10px;
  color: white;
  cursor: pointer;
}

/* ===== ANIM ===== */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth-overlay">
  <div id="auth-box">
    <img src="https://spoc.pro/wp-content/uploads/2025/04/Spocky.png" class="auth-logo">
    <h2>Bienvenue 👋</h2>
    <p>Merci de renseigner vos informations pour accéder au support SPOC.</p>

    <input id="firstName" placeholder="Prénom">
    <input id="lastName" placeholder="Nom">
    <input id="email" placeholder="Adresse e-mail">

    <button onclick="login()">Accéder au chat</button>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="header-left">
    <img src="https://spoc.pro/wp-content/uploads/2025/04/Spocky.png">
    <div>
      <div class="header-title">Spocky</div>
      <div style="font-size:12px;color:#aaa;">Assistant support SPOC</div>
    </div>
  </div>
  <div class="badge-user" id="userBadge"></div>
</header>

<!-- CHAT -->
<div id="chat"></div>

<!-- INPUT -->
<footer>
  <input id="input" placeholder="Écris ton message…">
  <button onclick="send()">Envoyer</button>
</footer>

<script>
const WEBHOOK_URL = "https://spoc-cloud.app.n8n.cloud/webhook/spocky/help";
const SESSION_KEY = "spocky_session";

function getSessionId() {
  let id = localStorage.getItem(SESSION_KEY);
  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem(SESSION_KEY, id);
  }
  return id;
}

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "message " + who;
  div.innerHTML = text;
  document.getElementById("chat").appendChild(div);
  div.scrollIntoView();
}

function login() {
  const f = firstName.value.trim();
  const l = lastName.value.trim();
  const e = email.value.trim();
  if (!f || !l || !e) return alert("Champs manquants");

  localStorage.setItem("spocky_user", JSON.stringify({ f, l, e }));
  document.getElementById("auth-overlay").style.display = "none";
  document.getElementById("userBadge").innerText = `Connecté en tant que ${f} ${l}`;

  addMessage(
    `Bonjour ${f} 👋<br>
     Je suis Spocky, assistant support SPOC.<br>
     Vous pouvez me décrire votre problème ou votre demande.`,
    "bot"
  );
}

async function send() {
  const msg = input.value.trim();
  if (!msg) return;

  addMessage(msg, "user");
  input.value = "";

  const res = await fetch(WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      chatInput: msg,
      sessionId: getSessionId()
    })
  });

  const data = await res.json();
  addMessage(data.message || "Réponse vide", "bot");
}

/* Auto-login */
const user = JSON.parse(localStorage.getItem("spocky_user"));
if (user) {
  document.getElementById("auth-overlay").style.display = "none";
  document.getElementById("userBadge").innerText =
    `Connecté en tant que ${user.f} ${user.l}`;

  addMessage(
    `Bonjour ${user.f} 👋<br>
     Je suis Spocky, assistant support SPOC.<br>
     Vous pouvez me décrire votre problème ou votre demande.`,
    "bot"
  );
}
</script>

</body>
</html>
